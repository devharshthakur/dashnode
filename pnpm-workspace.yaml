packages:
  - 'apps/*'
  - 'packages/*'

# pnpm blocks dependency build scripts by default; only these may run them.
allowBuilds:
  '@google/genai': true
  esbuild: true
  lightningcss: true
  mongodb-memory-server: true
  protobufjs: true
  unrs-resolver: true

minimumReleaseAge: 1440

# Keep TypeScript pinned across all workspace packages.
# Prevents `pnpm update` and `pnpm update --latest` from bumping it.
update:
  ignoreDeps:
    - typescript

saveExact: true
engineStrict: true
autoInstallPeers: true
strictPeerDependencies: true

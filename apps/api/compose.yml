name: hashnode-clone

services:
  mongodb:
    image: mongo:7.0
    container_name: hashnode-mongodb
    restart: unless-stopped
    # Single-node replica set. MongoDB only allows multi-document transactions
    # (and change streams) on a replica set, so even local dev runs one.
    # `mongo-init` below turns it on automatically when you run `db:up`.
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: hashnode
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot helper: initiates the replica set (idempotent) and waits until a
  # primary is elected so the API can immediately use transactions.
  mongo-init:
    image: mongo:7.0
    container_name: hashnode-mongodb-init
    depends_on:
      mongodb:
        condition: service_healthy
    restart: 'no'
    entrypoint: ['bash', '/init/mongo-init.sh']
    volumes:
      - ./scripts/mongo-init.sh:/init/mongo-init.sh:ro

volumes:
  mongo_data:
